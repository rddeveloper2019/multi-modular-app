name: multimodular_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: 5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  melos: ^7.5.1
  build_runner: ^2.3.3

flutter:
  uses-material-design: true

melos:
  useRootAsPackage: true
  command:
    bootstrap:
      environment:
        sdk: ^3.11.3
        flutter: ">=3.0.0 <4.0.0"
      dependencies:
        dio: 5.9.2
        cupertino_icons:
          ^1.0.8
          # git: https://github.com/SamJakob/uni_links_macos.git

      dev_dependencies:
        flutter_lints: ^6.0.0

        flutter_test:
          sdk: flutter
        build_runner: ^2.3.3

      hooks:
        # post: dart pub run build_runner build -d
  scripts:
    hello:
      name: hey
      description: Greet the world
      run: echo $GREETING World
      env:
        GREETING: Hey
    upgrade:
      run: flutter pub upgrade --major-versions

workspace:
  - core/data
  - core/domain
  - core/presentation
  - features/auth/login
  - features/auth/register
  - features/home/main
  - features/movies
  - features/settings/app_settings
  - features/settings/profile
